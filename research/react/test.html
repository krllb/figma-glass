<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:16px sans-serif}#hero{position:relative;width:600px;height:260px;background:linear-gradient(90deg,#f80,#08f)}.g{position:absolute;left:60px;top:60px;width:260px;height:100px;border:0;color:#fff;font:700 16px sans-serif}</style>
<div id="root"></div><pre id="result" style="white-space:pre-wrap;width:1200px;font:14px monospace"></pre>
<script>const out=m=>{const r=document.getElementById("result");r.textContent=(r.textContent?"":"")+"ERR "+m;};addEventListener("error",e=>out(e.message+" @"+(e.filename||"")+":"+e.lineno));addEventListener("unhandledrejection",e=>out(String(e.reason&&e.reason.stack||e.reason)));</script>
<script type="importmap">{"imports":{"figma-glass":"../../packages/figma-glass/src/index.js","figma-glass/react":"../../packages/figma-glass/src/react.js","react":"https://esm.sh/react@18.3.1?dev","react-dom/client":"https://esm.sh/react-dom@18.3.1/client?dev"}}</script>
<script type="module">
import React, { useRef, useState, StrictMode } from 'react';
import { createRoot } from 'react-dom/client';
import { Glass } from 'figma-glass/react';
const h = React.createElement, R = { renders: 0, glassRenders: 0, modes: [] };
window.__errs = []; addEventListener('error', e => __errs.push(e.message));
const ce = console.error; console.error = (...a) => { __errs.push(a.join(' ').slice(0, 200)); ce(...a); };
let api;
function App() {
  const hero = useRef(null), [n, setN] = useState(0), [frost, setFrost] = useState(4), [show, setShow] = useState(true), btn = useRef(null);
  api = { setN, setFrost, setShow, btn };
  R.renders++;
  return h('div', { id: 'hero', ref: hero }, show && h(Glass, { as: 'button', ref: btn, className: 'g', id: 'glass', type: 'button',
    refraction: 0.8, depth: 20, dispersion: 0.5, frost, lightAngle: -45, lightIntensity: 0.8, radius: 9999, fill: 'rgba(255,255,255,.2)',
    source: hero, mode: { webkit: 'mirror' }, onRender: s => { R.glassRenders++; R.modes.push(s.mode); } }, 'Buy ' + n));
}
createRoot(document.getElementById('root')).render(h(StrictMode, null, h(App)));
const wait = ms => new Promise(r => setTimeout(r, ms));
await wait(1500);
const g0 = R.glassRenders;
for (let i = 1; i <= 30; i++) { api.setN(i); await wait(16); }
await wait(300);
R.rerendersWithoutGlassUpdate = R.glassRenders - g0;
R.text = document.getElementById('glass').textContent;
R.tag = document.getElementById('glass').tagName; R.refIsButton = api.btn.current && api.btn.current.tagName;
const g1 = R.glassRenders; api.setFrost(10); await wait(400); R.frostUpdateRenders = R.glassRenders - g1;
R.pad = getComputedStyle(document.getElementById('glass').firstElementChild).top;
R.layerSets = [...document.getElementById('glass').children].filter(c => c.hasAttribute('data-glass-ignore')).length;
R.mode = R.modes[R.modes.length - 1];
api.setShow(false); await wait(300);
R.afterUnmount = { glass: !!document.getElementById('glass'), filters: document.querySelectorAll('svg defs filter').length, clones: document.querySelectorAll('[data-glass-clone]').length };
R.errors = __errs; delete R.modes;
document.getElementById('result').textContent = JSON.stringify(R);
</script>
