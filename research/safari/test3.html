<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:16px sans-serif}#wrap{width:640px}#src{position:relative;padding:20px;background:#fc0}.g{position:absolute;width:200px;height:120px;left:30px;top:10px}</style>
<div id="wrap"><div id="src"><p id="txt">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua</p><div class="g" id="g1"></div></div></div>
<pre id="result" style="font:16px monospace"></pre>
<script type="importmap">{"imports":{"figma-glass":"../../packages/figma-glass/src/index.js"}}</script>
<script type="module">
import { attach } from 'figma-glass';
const $ = id => document.getElementById(id), R = {};
attach($('g1'), { source: $('src'), mode: 'mirror', frost: 0 });
const wait = ms => new Promise(r => setTimeout(r, ms));
await wait(800);
const cl = document.querySelector('#g1 [data-glass-clone]');
$('wrap').style.width = '333.5px'; await wait(400);
R.sameClone = cl === document.querySelector('#g1 [data-glass-clone]');
R.cloneWidth = cl.style.width; R.src = $('src').getBoundingClientRect().width;
const t = $('txt').getBoundingClientRect(), p = cl.querySelector('p').getBoundingClientRect();
R.align = [[t.left, t.top, t.height], [p.left, p.top, p.height]].map(a => a.map(v => Math.round(v * 10) / 10));
$('result').textContent = JSON.stringify(R);
</script>
