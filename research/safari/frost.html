<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#fff}.src{position:absolute;width:300px;height:200px;top:20px;background:linear-gradient(90deg,#000 50%,#fff 50%)}.g{position:absolute;left:50px;top:40px;width:200px;height:120px}</style>
<div id="cells"></div><pre id="result"></pre>
<script type="importmap">{"imports":{"figma-glass":"../../packages/figma-glass/src/index.js"}}</script>
<script type="module">
import { attach } from 'figma-glass';
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'mirror', blur = q.get('blur') || 'auto', filterDpr = Number(q.get('fdpr') || 0), refraction = Number(q.get('refr') || 0);
const cells = document.getElementById('cells'), glasses = [];
[4, 10, 20].forEach((frost, i) => {
  const s = document.createElement('div'); s.className = 'src'; s.style.left = 20 + i * 320 + 'px';
  const g = document.createElement('div'); g.className = 'g'; s.append(g); cells.append(s);
  glasses.push(attach(g, { source: s, mode, blur, frost, refraction, filterDpr, dispersion: 0, lightIntensity: 0, radius: 16 }));
});
setTimeout(() => { document.getElementById('result').textContent = JSON.stringify(glasses.map(g => g.state.mode)); }, 2500);
</script>
