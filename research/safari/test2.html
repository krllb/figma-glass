<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:16px sans-serif}#src{position:relative;width:600px;padding:20px;background:linear-gradient(90deg,#f80,#08f)}.g{position:absolute;width:200px;height:120px}#mover{width:40px;height:40px;background:#000}</style>
<div id="src"><p id="txt">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore</p><div id="mover"></div><span id="count">0</span>
<div class="g" id="g1" style="left:30px;top:10px"></div><div class="g" id="g2" style="left:300px;top:60px"></div></div>
<pre id="result" style="font:16px monospace;white-space:pre-wrap"></pre>
<script type="importmap">{"imports":{"figma-glass":"../../packages/figma-glass/src/index.js"}}</script>
<script type="module">
import { attach } from 'figma-glass';
const $ = id => document.getElementById(id), src = $('src'), R = {};
let clones = 0; const oc = Node.prototype.cloneNode; Node.prototype.cloneNode = function (d) { if (this === src) clones++; return oc.call(this, d); };
const g1 = attach($('g1'), { source: src, mode: 'mirror', frost: 0 }), g2 = attach($('g2'), { source: src, mode: 'mirror', frost: 0 });
const wait = ms => new Promise(r => setTimeout(r, ms));
await wait(800);
const c0 = clones; let n = 0;
await new Promise(res => { const f = () => { n++; $('mover').style.transform = `translateX(${n}px)`; $('count').firstChild.data = n; n < 120 ? requestAnimationFrame(f) : res(); }; requestAnimationFrame(f); });
await wait(100);
R.clonesDuring120Frames = clones - c0;
const cl = document.querySelector('#g1 [data-glass-clone]');
R.moverCopy = [...cl.querySelectorAll('div')].find(d => (d.getAttribute('style')||'').includes('translateX'))?.style.transform;
src.style.width = '400px'; await wait(300);
const cl2 = document.querySelector('#g1 [data-glass-clone]'); R.rebuiltOnSourceStyle = cl2 !== cl; R.cloneWidth = cl2.style.width; R.srcBox = src.getBoundingClientRect().width + 'px';
$('g1').style.transform = 'scale(1.2)'; await wait(300);
const t = $('txt').getBoundingClientRect(), p = document.querySelector('#g1 [data-glass-clone] p').getBoundingClientRect();
R.scaleAlign = [[t.left, t.top, t.width], [p.left, p.top, p.width]].map(a => a.map(Math.round));
$('result').textContent = JSON.stringify(R);
</script>
