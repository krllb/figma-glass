# A v* tag stages the release on npm through trusted publishing (OIDC, no token in the repo); it goes
# live once the package owner approves it on npmjs.com with their passkey.
name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Trusted publishing and staged publishing need a current npm.
      - run: npm install -g npm@latest
      - name: Tag matches the package version
        run: test "v$(node -p "require('./packages/figma-glass/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm stage publish
        working-directory: packages/figma-glass
